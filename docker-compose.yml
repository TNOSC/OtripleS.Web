services:
  web:
    image: tnosc.otriples.client.web
    container_name: otriples-webfrontend
    build:
      context: .
      dockerfile: src/Tnosc.OtripleS.Client.Web/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OtriplesApiBaseAddress=http://apiservice:8080/
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
